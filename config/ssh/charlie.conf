# Managed SSH routing for charlie.
#
# `charlie` automatically prefers the authenticated LAN endpoint.
# `charlie-tunnel` always uses the reverse tunnel through acorn.

Host acorn-jump
    HostName 8.159.128.125
    User c1
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes

Host charlie charlie-tunnel
    User c1
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    HostKeyAlias charlie
    CheckHostIP no
    ConnectTimeout 5
    ServerAliveInterval 60
    ServerAliveCountMax 3

Host charlie-tunnel
    HostName 127.0.0.1
    Port 2222
    ProxyJump acorn-jump

Match originalhost charlie exec "/Users/c1/.local/bin/ssh-route-probe charlie 192.168.10.4 22"
    HostName 192.168.10.4
    Port 22
    ProxyJump none

# OpenSSH keeps the first value obtained for each setting. When the authenticated
# LAN probe matched above, these fallback values are ignored.
Match originalhost charlie
    HostName 127.0.0.1
    Port 2222
    ProxyJump acorn-jump

Host *
