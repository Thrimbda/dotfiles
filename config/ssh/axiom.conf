# Managed SSH routing for axiom.
# `axiom` prefers the authenticated LAN endpoint; `axiom-tunnel` forces Ant.

Host axiom axiom-tunnel
    User c1
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    HostKeyAlias axiom
    CheckHostIP no
    ConnectTimeout 5
    ServerAliveInterval 60
    ServerAliveCountMax 3

Host axiom-tunnel
    HostName 127.0.0.1
    Port 2223
    ProxyJump ant-jump

Match originalhost axiom exec "\"%d/.local/bin/ssh-route-probe\" axiom 192.168.50.44 22"
    HostName 192.168.50.44
    Port 22
    ProxyJump none

# The authenticated LAN match takes precedence over these fallback values.
Match originalhost axiom
    HostName 127.0.0.1
    Port 2223
    ProxyJump ant-jump

Host *
